# Isometric 3D render of the contribution calendar, committed back into the
# repo as profile-3d-contrib/*.svg. Same caveat as the snake: it can only
# draw contributions the profile actually publishes.
name: 3D contribution calendar

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # A PAT with read:user sees more than the ephemeral job token does.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: regenerate the 3D contribution calendar"
          git push
